# Tiny Tapeout project information
project:
  title:        "ALU con sumador de 8bits y divisor haciendo uso de un pipeline"      # Project title
  author:       "Vidal Pezzarossi"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "ALU toma una operacion de suma o division en base al multiplexor , la division se aplica sobre un pipeline debido a su costo"      # One line description of what your project does
  language:     "SystemVerilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 202x155 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2, 8x2, 3x4, 4x4, 5x4, 6x4 or 8x4

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_alu_secuencial"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "prefix_adder.sv"
    - "Mux_instancia_ALU.sv"
    - "Buffer_Triestado.sv"
    - "divisor.sv"
    - "Mux_seleccion_ALU.sv"
    - "flags_nzcv.sv"
    - "Top_ALU.sv"
    - "Top_ALU_secuencial.sv"
    - "project.sv"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
 # Inputs
  ui[0]: "Operand bit 0"
  ui[1]: "Operand bit 1"
  ui[2]: "Operand bit 2"
  ui[3]: "Operand bit 3"
  ui[4]: "Operand bit 4"
  ui[5]: "Operand bit 5"
  ui[6]: "Operand bit 6"
  ui[7]: "Operand bit 7"

  # Outputs
  uo[0]: "Result bit 0"
  uo[1]: "Result bit 1"
  uo[2]: "Result bit 2"
  uo[3]: "Result bit 3"
  uo[4]: "Result bit 4"
  uo[5]: "Result bit 5"
  uo[6]: "Result bit 6"
  uo[7]: "Result bit 7"

  # Bidirectional pins
  uio[0]: "Operand select (0=A, 1=B)"
  uio[1]: "alu_control[0]"
  uio[2]: "alu_control[1]"
  uio[3]: "alu_control[2]"
  uio[4]: "Flag V (Overflow)"
  uio[5]: "Flag C (Carry)"
  uio[6]: "Flag Z (Zero)"
  uio[7]: "Flag N (Negative)"
# Do not change!
yaml_version: 6
